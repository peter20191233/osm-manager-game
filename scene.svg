  <title id="title">Светлое отделение банка</title>
  <desc id="desc">Уютный зал с окнами, растениями, двумя стойками сотрудников, местами ожидания и терминалом. Рядом с терминалом стоит улыбающийся операционно-сервисный менеджер в зелёном пиджаке.</desc>
